# Builds the app for Windows, macOS and Linux on every push and pull request.
# Pushing a tag like v1.0.0 also publishes all the files as a GitHub release, and the two Docker
# images to ghcr.io, then brings the release to Scoop, the AUR and winget (the last two only with
# their secrets set; see the README). A manual run with "Publish the Docker image" ticked pushes
# only the images.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      docker:
        description: Publish the Docker images for the version in package.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: one-take-windows
            # latest*.yml and .blockmap files tell installed copies about the update.
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS
            os: macos-latest
            artifact: one-take-mac
            files: release/*.dmg
          - name: Linux
            os: ubuntu-latest
            artifact: one-take-linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run dist -- --publish never
        env:
          # No Apple certificate: the Mac app gets an ad-hoc signature (scripts/after-pack.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Brings the release to package managers: the Scoop manifest in this repository's bucket/
  # folder, the AUR package in packaging/aur/, and the AUR itself (only when the AUR_SSH_KEY
  # secret is set).
  packages:
    name: Scoop and AUR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write the package files
        run: node scripts/package-manifests.mjs "${GITHUB_REF_NAME#v}" release packages

      # The Scoop bucket, and the AUR package for building it with makepkg from this repository.
      - name: Update the Scoop bucket and packaging/aur
        run: |
          mkdir -p bucket packaging/aur
          cp packages/scoop/one-take.json bucket/one-take.json
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO packaging/aur/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/one-take.json packaging/aur
          if ! git diff --cached --quiet; then
            git commit -m "Package files for One Take ${GITHUB_REF_NAME#v}"
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Publish to the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          # Cloning a package that does not exist yet gives an empty repository; the push creates it.
          git clone ssh://aur@aur.archlinux.org/one-take-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name 'Fixr'
          git config user.email '55257249+FeaXR@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "One Take ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master

  # Submits the release to winget as a pull request to microsoft/winget-pkgs, from a fork that
  # wingetcreate makes under the token's account. Only when the WINGET_TOKEN secret is set.
  winget:
    name: winget
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.WINGET_TOKEN != ''

      - uses: actions/download-artifact@v8
        if: env.WINGET_TOKEN != ''
        with:
          name: one-take-windows
          path: release

      - name: Submit to winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          node scripts/package-manifests.mjs $version release packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: FeaXR.OneTake version $version" "packages/winget/manifests/f/FeaXR/OneTake/$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  docker:
    name: Docker images
    if: startsWith(github.ref, 'refs/tags/v') || inputs.docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # The arm64 image (Raspberry Pi and similar) is built under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The server: editing in the browser, files and export on the server.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=One Take
            org.opencontainers.image.description=Record or open one long WAV and cut it into faded, peak-normalized MP3 files.
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Browser only: the container serves the page, everything else happens in the browser.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}-browser:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}-browser:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.title=One Take (browser only)
            org.opencontainers.image.description=One Take running entirely in the browser: the container only serves the page.
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
