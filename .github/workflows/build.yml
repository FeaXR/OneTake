# Builds the app for Windows, macOS and Linux on every push and pull request.
# Pushing a tag like v1.0.0 also publishes all the files as a GitHub release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: one-take-windows
            files: release/*.exe
          - name: macOS
            os: macos-latest
            artifact: one-take-mac
            files: release/*.dmg
          - name: Linux
            os: ubuntu-latest
            artifact: one-take-linux
            files: |
              release/*.AppImage
              release/*.deb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run dist -- --publish never
        env:
          # No Apple certificate: the Mac app gets an ad-hoc signature (scripts/after-pack.cjs).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
